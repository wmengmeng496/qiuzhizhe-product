services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: qiuzhi-assistant-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: qiuzhi-assistant-server:latest
    restart: unless-stopped
    env_file:
      - ../server/.env
    environment:
      APP_RELEASE: ${APP_RELEASE:-manual}
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
