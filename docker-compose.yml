services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./.env
    environment:
      APP_RELEASE: ${APP_RELEASE:-local}
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
